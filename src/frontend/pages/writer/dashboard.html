<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writer Dashboard</title>
    <link rel="stylesheet" href="../../assets/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <div class="brand-logo">W</div>
          <div class="brand-title">Writer</div>
        </div>
        <div class="navbar">
          <a href="../home/home.html">Trang chủ</a>
          <a href="../search/search.html">Tìm kiếm</a>
        </div>
      </div>
      <div class="page-card">
        <div class="section-title">
          <h2>Viết bài mới</h2>
        </div>
        <div id="article-feedback"></div>
        <form id="create-article-form">
          <div class="form-group">
            <label for="title">Tiêu đề</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="form-group">
            <label for="summary">Tóm tắt</label>
            <textarea id="summary" name="summary"></textarea>
          </div>
          <div class="form-group">
            <label for="category">Chuyên mục</label>
            <select id="category" name="category" required>
              <option value="Thời sự">Thời sự</option>
              <option value="Kinh doanh">Kinh doanh</option>
              <option value="Giải trí">Giải trí</option>
              <option value="Thể thao">Thể thao</option>
              <option value="Sức khỏe">Sức khỏe</option>
            </select>
          </div>
          <div class="form-group">
            <label for="heroImage">URL ảnh bìa</label>
            <input
              type="text"
              id="heroImage"
              name="heroImage"
              placeholder="https://..."
            />
          </div>
          <div class="form-group">
            <label for="body">Nội dung</label>
            <textarea id="body" name="body" required></textarea>
          </div>
          <button type="submit">Lưu bài viết</button>
        </form>
        <div class="section-title" style="margin-top: 32px">
          <h2>Bài viết mới nhất</h2>
        </div>
        <div id="article-list"></div>
      </div>
    </div>
    <script type="module" src="../../js/article.js"></script>
  </body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tìm kiếm</title>
    <link rel="stylesheet" href="../../assets/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <div class="brand-logo">B</div>
          <div class="brand-title">Báo VNXpress</div>
        </div>
        <div class="navbar">
          <a href="../home/home.html">Trang chủ</a>
          <a href="../auth/login.html">Đăng nhập</a>
        </div>
      </div>
      <div class="page-card">
        <div class="section-title">
          <h2>Tìm kiếm tin tức</h2>
        </div>
        <form id="search-form">
          <div class="form-group">
            <label for="query">Nhập từ khóa</label>
            <input
              type="text"
              id="query"
              name="query"
              placeholder="Tìm kiếm bài báo, sự kiện, chủ đề..."
              required
            />
          </div>
          <button type="submit">Tìm kiếm</button>
        </form>
        <div id="search-results" style="margin-top: 20px"></div>
      </div>
    </div>
    <script type="module" src="../../js/search.js"></script>
  </body>
</html>

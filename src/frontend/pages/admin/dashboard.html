<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../../assets/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <div class="brand-logo">A</div>
          <div class="brand-title">Quản trị viên</div>
        </div>
        <div class="navbar">
          <a href="../home/home.html">Trang chủ</a>
          <a href="../auth/login.html">Đăng nhập</a>

            <h3>Sao lưu & quảng cáo</h3>

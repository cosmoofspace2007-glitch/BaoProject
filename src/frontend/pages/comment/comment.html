<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bình luận</title>
    <link rel="stylesheet" href="../../assets/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <div class="brand-logo">C</div>
          <div class="brand-title">Bình luận</div>
        </div>
        <div class="navbar">
          <a href="../home/home.html">Trang chủ</a>
          <a href="../search/search.html">Tìm kiếm</a>
        </div>
      </div>
      <div class="page-card">
        <div class="section-title">
          <h2>Gửi bình luận</h2>
        </div>
        <div id="comment-feedback"></div>
        <form id="comment-form">
          <input type="hidden" name="articleId" value="1" />
          <div class="form-group">
            <label for="content">Nội dung bình luận</label>
            <textarea
              id="content"
              name="content"
              placeholder="Viết bình luận..."
              required
            ></textarea>
          </div>
          <button type="submit">Gửi bình luận</button>
        </form>
        <div class="section-title" style="margin-top: 32px">
          <h2>Các bình luận</h2>
        </div>
        <ul class="comment-list">
          <li class="comment-item">
            <div class="comment-meta">
              <span>Người dùng 1</span>
              <span>12 phút trước</span>
            </div>
            <p>
              Đây là bình luận mẫu. Trang sẽ hiển thị danh sách bình luận thật
              khi kết nối API.
            </p>
          </li>
        </ul>
      </div>
    </div>
    <script type="module" src="../../js/comment.js"></script>
  </body>
</html>
